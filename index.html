<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЛАД — реставрация и ремонт гитар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,560;0,9..144,680;1,9..144,450&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root{
    --bg:#17110c;
    --bg-deep:#100c08;
    --surface:rgba(255,255,255,0.045);
    --surface-hover:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.10);
    --text:#f6efe1;
    --text-body:rgba(246,239,225,0.72);
    --text-muted:rgba(246,239,225,0.52);
    --brass:#d9a85c;
    --brass-soft:rgba(217,168,92,0.85);
    --accent:#c1502f;
    --accent-deep:#9c3d22;
    --radius:16px;
    --radius-sm:12px;
    --shadow-sm:0 4px 18px rgba(0,0,0,0.28);
    --shadow-md:0 14px 36px rgba(0,0,0,0.38);
    --shadow-lg:0 22px 54px rgba(0,0,0,0.48);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:16px;
    line-height:1.5;
  }
  .display{font-family:'Fraunces',serif;}
  a{color:inherit;}

  .shell{
    max-width:1120px;
    margin:0 auto;
    padding:0 32px;
  }

  /* ===== Header / nav ===== */
  header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(16,12,8,0.55);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .header-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 0;
    gap:20px;
  }
  .logo{
    font-family:'Fraunces',serif;
    font-weight:680;
    font-size:1.6rem;
    letter-spacing:0.01em;
    text-decoration:none;
    display:flex;
    align-items:baseline;
    gap:10px;
    color:var(--text);
  }
  .logo span{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:0.74rem;
    color:var(--text-muted);
    letter-spacing:0.02em;
  }
  nav{
    display:flex;
    gap:4px;
    background:rgba(255,255,255,0.05);
    padding:6px;
    border-radius:999px;
    border:1px solid var(--border);
  }
  nav button{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:0.9rem;
    background:none;
    border:none;
    color:var(--text-body);
    cursor:pointer;
    padding:11px 18px;
    border-radius:999px;
    transition:background 0.22s ease, color 0.22s ease;
  }
  nav button:hover{color:var(--text); background:rgba(255,255,255,0.06);}
  nav button.active{
    background:rgba(255,255,255,0.14);
    color:var(--text);
  }

  .page{animation:rise 0.5s cubic-bezier(.2,.7,.3,1);}
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){.page{animation:none;}}

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.98rem;
    padding:16px 30px;
    background:var(--accent);
    color:#fff7ec;
    text-decoration:none;
    border:none;
    border-radius:var(--radius-sm);
    cursor:pointer;
    box-shadow:var(--shadow-md);
    transition:transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .btn:hover{background:var(--accent-deep); transform:translateY(-2px); box-shadow:var(--shadow-lg);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.7; cursor:not-allowed; transform:none;}
  .btn-ghost{
    background:rgba(255,255,255,0.06);
    color:var(--text);
    border:1px solid rgba(255,255,255,0.22);
    box-shadow:none;
  }
  .btn-ghost:hover{background:rgba(255,255,255,0.12); box-shadow:none;}
  .btn-instagram{
    /* фирменный градиент Instagram */
    background:linear-gradient(45deg, #f9ce34 0%, #ee2a7b 45%, #6228d7 100%);
    gap:10px;
    margin-top:26px;
    text-decoration:none;
  }
  .btn-instagram svg{width:19px; height:19px; flex-shrink:0;}
  .btn-instagram:hover{filter:brightness(1.08); background:linear-gradient(45deg, #f9ce34 0%, #ee2a7b 45%, #6228d7 100%);}

  /* ===== HERO ===== */
  .hero{
    position:relative;
    z-index:10;
    height:100vh;
    min-height:620px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    text-align:center;
  }
  .hero video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(10,7,4,0.55) 0%, rgba(10,7,4,0.45) 45%, rgba(16,12,8,0.85) 100%);
    z-index:1;
  }
  .hero-content{
    position:relative;
    z-index:2;
    max-width:760px;
    padding:0 28px;
  }
  .hero-content h1{
    font-size:clamp(2.3rem, 5vw, 3.6rem);
    line-height:1.14;
    font-weight:560;
    margin:0 0 20px;
    color:#fff;
    letter-spacing:-0.01em;
  }
  .hero-content p{
    font-size:1.1rem;
    line-height:1.6;
    color:rgba(255,255,255,0.82);
    max-width:52ch;
    margin:0 auto 34px;
  }
  .scroll-cue{
    position:absolute;
    bottom:36px;
    left:50%;
    transform:translateX(-50%);
    z-index:2;
    font-size:0.78rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.6);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .scroll-cue::after{
    content:"";
    width:1px;
    height:34px;
    background:linear-gradient(180deg, rgba(255,255,255,0.7), transparent);
    animation:cueMove 1.8s ease-in-out infinite;
  }
  @keyframes cueMove{
    0%{transform:scaleY(0.3); opacity:0.2; transform-origin:top;}
    50%{transform:scaleY(1); opacity:1; transform-origin:top;}
    100%{transform:scaleY(0.3); opacity:0.2; transform-origin:top;}
  }

  /* ============================================================
     ЛЕТЯЩАЯ ГИТАРА — слой ПОД контентом.
     Важно: z-index контейнера (4) специально ниже, чем у .hero,
     .features и .cta-footer (у них z-index:10 — см. ниже). Так
     как все эти секции — самостоятельные stacking-контексты
     (position + z-index), гитара всегда красится ПОД ними: под
     видео в hero, под текстом в features, под фоном cta-footer.
     Гитара "проступает" только там, где сверху нет непрозрачных
     пикселей (пустые места вокруг текста и по краям видео).
     ============================================================ */
  .guitar-container{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    pointer-events:none;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1400px;
  }
  .flying-guitar{
    width:min(34vw, 380px);
    max-width:78vw;
    opacity:0;
    filter:drop-shadow(0 30px 70px rgba(0,0,0,0.65));
    transform-style:preserve-3d;
    will-change:transform, opacity;
  }

  /* ===== FEATURES (секция, сквозь которую пролетает и в которой замирает гитара) ===== */
  .features{
    position:relative;
    z-index:10;
    min-height:150vh;
    padding:14vh 0;
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    gap:12vh;
  }
  .feature-block{
    max-width:480px;
    position:relative;
    z-index:5;
  }
  .feature-block:nth-child(2){align-self:flex-end; text-align:right;}
  .feature-block small{
    display:block;
    font-size:0.78rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--brass);
    margin-bottom:14px;
  }
  .feature-block h2{
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:clamp(1.7rem, 3.2vw, 2.3rem);
    margin:0 0 16px;
    color:var(--text);
    line-height:1.2;
  }
  .feature-block p{
    margin:0;
    font-size:1.04rem;
    line-height:1.75;
    color:var(--text-body);
  }

  /* ===== CTA-FOOTER ===== */
  .cta-footer{
    position:relative;
    z-index:10;
    height:100vh;
    min-height:600px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    text-align:center;
    background:radial-gradient(ellipse at 50% 30%, rgba(193,80,47,0.16), transparent 60%), var(--bg-deep);
    border-top:1px solid var(--border);
  }
  .cta-footer-inner{position:relative; z-index:3; max-width:640px; padding:0 28px;}
  .cta-footer h2{
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:clamp(2rem, 4.2vw, 2.9rem);
    margin:0 0 18px;
    color:var(--text);
    line-height:1.2;
  }
  .cta-footer p{
    margin:0 0 32px;
    font-size:1.06rem;
    line-height:1.65;
    color:var(--text-body);
  }

  /* ===== Sections below hero ===== */
  .intro{
    padding:88px 0 8px;
  }
  .intro p{
    font-size:1.14rem;
    line-height:1.7;
    max-width:60ch;
    color:var(--text-body);
    margin:0;
  }

  .strip{
    padding:44px 0 92px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
  }
  .strip .item{
    background:var(--surface);
    border:1px solid var(--border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:var(--radius);
    padding:32px 28px;
    transition:transform 0.25s ease, background 0.25s ease;
  }
  .strip .item:hover{transform:translateY(-5px); background:var(--surface-hover);}
  .strip .item small{
    display:block;
    font-size:0.76rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.07em;
    color:var(--brass);
    margin-bottom:12px;
  }
  .strip .item strong{
    display:block;
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:1.22rem;
    margin-bottom:10px;
    color:var(--text);
  }
  .strip .item p{margin:0; font-size:0.96rem; color:var(--text-body); line-height:1.6;}

  .story{
    background:var(--surface);
    border:1px solid var(--border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:var(--radius);
    display:grid;
    grid-template-columns:0.9fr 1.1fr;
    gap:64px;
    padding:56px;
    margin-bottom:96px;
  }
  .story h2{
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:2rem;
    margin:0;
    line-height:1.25;
    color:var(--text);
  }
  .story .body p{font-size:1.02rem; line-height:1.75; color:var(--text-body); margin:0 0 18px;}

  .cta-band{
    padding:64px 56px;
    text-align:left;
    background:linear-gradient(135deg, rgba(193,80,47,0.22), rgba(193,80,47,0.06));
    border:1px solid rgba(217,168,92,0.2);
    border-radius:var(--radius);
    margin-bottom:96px;
  }
  .cta-band h2{
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:1.9rem;
    max-width:22ch;
    margin:0 0 28px;
    color:var(--text);
  }

  /* ===== SERVICES ===== */
  .page-head{padding:80px 0 36px;}
  .page-head .eyebrow{
    font-size:0.86rem;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 14px;
  }
  .page-head h1{
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:clamp(2.1rem, 4vw, 2.8rem);
    margin:0 0 18px;
    color:var(--text);
  }
  .page-head p{
    max-width:58ch;
    color:var(--text-body);
    line-height:1.65;
    font-size:1.05rem;
  }

  .services-list{padding:12px 0 20px; display:flex; flex-direction:column; gap:28px;}

  /* ===== Хаб "Услуги" — две кнопки-плашки по отделам ===== */
  .dept-link-grid{
    padding:12px 0 20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    align-items:stretch;
  }
  .dept-link-card{
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    background:var(--surface);
    border:1px solid var(--border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:var(--radius);
    padding:38px 34px 32px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:16px;
    transition:transform 0.25s ease, background 0.25s ease;
  }
  .dept-link-card:hover{transform:translateY(-4px); background:var(--surface-hover);}
  .dept-link-card .dept-icon{
    font-size:1.5rem;
    width:52px;
    height:52px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(217,168,92,0.12);
    border:1px solid rgba(217,168,92,0.24);
    border-radius:50%;
  }
  .dept-link-card h2{
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:1.4rem;
    margin:0;
    color:var(--text);
  }
  .dept-link-card p{
    margin:0;
    font-size:0.98rem;
    line-height:1.6;
    color:var(--text-body);
  }
  .dept-link-cta{
    margin-top:auto;
    padding-top:6px;
    font-size:0.92rem;
    font-weight:600;
    color:var(--brass);
    display:inline-flex;
    align-items:center;
    gap:6px;
  }

  /* ===== Ссылка "назад" на детальных страницах отдела ===== */
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:inherit;
    font-size:0.9rem;
    font-weight:600;
    color:var(--text-body);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    margin-bottom:18px;
    transition:color 0.2s ease;
  }
  .back-link:hover{color:var(--brass);}

  .service-card{
    background:var(--surface);
    border:1px solid var(--border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:var(--radius);
    padding:40px 40px 36px;
    transition:transform 0.25s ease, background 0.25s ease;
  }
  .service-card:hover{transform:translateY(-3px); background:var(--surface-hover);}
  
  .service-card-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .service-card-header h3{
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:1.65rem;
    margin:0 0 8px;
    color:var(--text);
  }
  .service-card-header .badge{
    display:inline-block;
    font-size:0.78rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--brass);
    background:rgba(217,168,92,0.12);
    border:1px solid rgba(217,168,92,0.22);
    padding:6px 14px;
    border-radius:999px;
  }
  .service-meta{
    text-align:right;
    flex-shrink:0;
  }
  .service-meta .price{
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:1.5rem;
    display:block;
    margin-bottom:6px;
    color:var(--brass);
  }
  .service-meta .time{
    font-size:0.86rem;
    font-weight:500;
    color:var(--text-body);
    background:rgba(255,255,255,0.06);
    border:1px solid var(--border);
    padding:5px 12px;
    border-radius:999px;
    display:inline-block;
  }

  .service-body p{
    margin:0 0 16px;
    color:var(--text-body);
    line-height:1.7;
    font-size:1.02rem;
  }

  .service-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    margin-top:20px;
  }
  .service-point{
    background:rgba(0,0,0,0.18);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:18px 20px;
  }
  .service-point strong{
    display:block;
    font-size:0.95rem;
    font-weight:600;
    color:var(--text);
    margin-bottom:6px;
  }
  .service-point span{
    font-size:0.9rem;
    color:var(--text-body);
    line-height:1.5;
  }

  .service-list-items{
    margin:18px 0 0;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .service-list-items li{
    display:flex;
    gap:12px;
    align-items:flex-start;
    color:var(--text-body);
    font-size:0.98rem;
    line-height:1.55;
  }
  .service-list-items li::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--brass);
    margin-top:7px;
    flex-shrink:0;
  }

  .note-band{
    padding:32px 34px;
    margin:28px 0 96px;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--brass);
    border-radius:var(--radius);
  }
  .note-band p{margin:0; font-size:0.98rem; line-height:1.7; color:var(--text-body); max-width:70ch;}

  /* ===== REVIEWS ===== */
  .reviews-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
    padding:12px 0 96px;
  }
  .review-card{
    background:var(--surface);
    border:1px solid var(--border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:var(--radius);
    padding:32px 28px;
    display:flex;
    flex-direction:column;
    gap:16px;
    transition:transform 0.25s ease, background 0.25s ease;
  }
  .review-card:hover{transform:translateY(-4px); background:var(--surface-hover);}
  .review-stars{
    display:flex;
    gap:3px;
    color:var(--brass);
    font-size:1.05rem;
    letter-spacing:1px;
  }
  .review-ig-header{display:flex; align-items:center; gap:12px;}
  .review-avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:1rem;
    color:#fff;
    background:linear-gradient(45deg, #f9ce34, #ee2a7b 55%, #6228d7);
    flex-shrink:0;
  }
  .review-username{font-weight:600; font-size:0.95rem; color:var(--text);}
  .review-ig-meta{
    display:flex;
    gap:16px;
    font-size:0.82rem;
    color:var(--text-muted);
  }
  .review-text{
    font-size:0.98rem;
    line-height:1.65;
    color:var(--text-body);
    flex:1;
    margin:0;
  }
  .review-author{
    font-family:'Fraunces',serif;
    font-weight:560;
    font-size:1.05rem;
    color:var(--text);
    margin:0;
  }
  .review-author span{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:0.85rem;
    color:var(--text-muted);
    margin-top:4px;
  }

  /* ===== CONTACTS ===== */
  .contact-grid{
    padding:12px 0 96px;
    display:grid;
    grid-template-columns:0.95fr 1.05fr;
    gap:28px;
    align-items:start;
  }
  .contact-cards{display:flex; flex-direction:column; gap:20px;}
  .contact-block{
    padding:28px 30px;
    background:var(--surface);
    border:1px solid var(--border);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:var(--radius);

/* ============================================================
   АНИМАЦИЯ ЛЕТЯЩЕЙ ГИТАРЫ (GSAP + ScrollTrigger)
   ============================================================
   Гитара — это <img id="flying-guitar"> внутри position:fixed
   контейнера .guitar-container (z-index у него НИЖЕ, чем у
   .hero/.features/.cta-footer — см. CSS). Поэтому гитара всегда
   рисуется ПОД видео, ПОД текстом и ПОД фоном cta-footer: видна
   только там, где сверху нет непрозрачных пикселей.

   Сценарий:
   1) Пока идёт .hero — гитара полностью скрыта под видео.
   2) Когда .hero почти прокручен (виден его нижний край), гитара
      начинает "выныривать" снизу-из-под видео — плавно растёт,
      проявляется и слегка вращается в 3D.
   3) Продолжает лёгкий полёт поверх текста .features и примерно
      на середине секции ЗАМИРАЕТ в статичной позе (как на
      референсе) — дальше скролл её больше не двигает, она остаётся
      "вмороженной" в этом месте экрана, пока следующий текст
      проезжает поверх/под ней.
   4) Как только пользователь докручивает до конца .cta-footer
      (переходит к обычному подвалу сайта) — гитару плавно прячем,
      чтобы она не всплывала поверх футера. При скролле назад —
      возвращаем.

   SPA перерисовывает #app через innerHTML, поэтому при каждом
   уходе со страницы "Главная" старые ScrollTrigger нужно убивать.
   ============================================================ */
if (window.gsap && window.ScrollTrigger) {
  gsap.registerPlugin(ScrollTrigger);
}

function killHeroAnimation(){
  if (window.ScrollTrigger) {
    ScrollTrigger.getAll().forEach(st => {
      if (st.vars.id === 'guitar-flight' || st.vars.id === 'guitar-footer-hide') st.kill();
    });
  }
}

function initHeroAnimation(){
  if (!window.gsap || !window.ScrollTrigger) return; // на случай если CDN не загрузился

  const guitar = document.getElementById('flying-guitar');
  const ctaFooter = document.getElementById('cta-footer');
  const heroSection = document.querySelector('.hero');
  const featuresSection = document.querySelector('.features');
  if (!guitar || !ctaFooter || !heroSection || !featuresSection) return;

  const isMobile = window.matchMedia('(max-width: 760px)').matches;

  // Финальная "замершая" поза гитары (координаты — смещение от центра
  // экрана, т.к. контейнер отцентрован флексом). На мобиле держим
  // гитару ближе к центру и мельче, чтобы не спорила с текстом.
  const restX = isMobile ? 0 : -70;
  const restY = isMobile ? -20 : -30;
  const restScale = isMobile ? 0.62 : 1;
  const restOpacity = isMobile ? 0.55 : 1; // на мобиле немного прозрачнее — текст читается легче

  // Стартовое состояние: гитара спрятана, уменьшена, сдвинута вниз
  // (как будто ещё лежит "под" видео и ждёт своего выезда).
  gsap.set(guitar, {
    opacity: 0,
    scale: 0.22,
    x: 0,
    y: 220,
    rotation: -20,
    rotationX: 30,
    rotationY: -50
  });

  const tl = gsap.timeline({
    scrollTrigger: {
      id: 'guitar-flight',
      trigger: heroSection,
      start: 'bottom 90%',   // старт чуть РАНЬШЕ полного ухода hero — гитара начинает "выныривать" из-под видео
      endTrigger: featuresSection,
      end: '55% top',        // финал — примерно середина .features, дальше гитара "вморожена" на месте
      scrub: 1.1,
      // markers: true,       // включите для отладки таймингов
      onLeaveBack: () => gsap.set(guitar, { opacity: 0 })
    }
  });

  // ---------- ФАЗА 1: ВЫНЫРИВАНИЕ ИЗ-ПОД ВИДЕО (0 → 1) ----------
  // Гитара едет вверх (y: 220 → 40), проявляется (opacity 0 → 1) и
  // растёт (scale 0.22 → 0.85), одновременно выравнивается из 3D-наклона.
  // Увеличьте стартовые rotationX/Y выше, чтобы "вылет" был резче.
  tl.to(guitar, {
    opacity: 1,
    scale: 0.85,
    y: 40,
    x: isMobile ? 0 : 20,
    rotation: -6,
    rotationX: 6,
    rotationY: -12,
    duration: 1,
    ease: 'power2.out'
  }, 0);

  // ---------- ФАЗА 2: КОРОТКИЙ ПОЛЁТ И ФИКСАЦИЯ (1 → 2) ----------
  // Гитара довращивается и доезжает до финальной "замершей" позы
  // (restX/restY/restScale выше). После этой точки таймлайн закончен —
  // дальше по скроллу трансформация просто не меняется (гитара стоит).
  tl.to(guitar, {
    x: restX,
    y: restY,
    scale: restScale,
    opacity: restOpacity,
    rotation: -7,
    rotationX: 0,
    rotationY: 0,
    duration: 1.6,
    ease: 'power2.inOut'
  }, 1);

  // ---------- Прячем гитару, когда уходим ниже .cta-footer ----------
  // Иначе она (будучи fixed) осталась бы висеть на том же месте экрана
  // и наезжала бы на обычный подвал сайта.
  ScrollTrigger.create({
    id: 'guitar-footer-hide',
    trigger: ctaFooter,
    start: 'bottom top',
    onEnter: () => gsap.to(guitar, { opacity: 0, duration: 0.3, overwrite: 'auto' }),
    onLeaveBack: () => gsap.to(guitar, { opacity: restOpacity, duration: 0.3, overwrite: 'auto' })
  });

  ScrollTrigger.refresh();
}

function showToast(message, isSuccess = true){
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast' + (isSuccess ? ' success' : '');
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => toast.classList.remove('show'), 4200);
}

function navigate(){
  killHeroAnimation(); // убираем ScrollTrigger предыдущей страницы, если он был
  const hash = (location.hash || '#home').replace('#','');
  const route = routes[hash] ? hash : 'home';
  document.getElementById('app').innerHTML = routes[route]();
  document.querySelectorAll('#nav button').forEach(btn=>{
    const isActive = btn.dataset.route === route || route.startsWith(btn.dataset.route + '-');
    btn.classList.toggle('active', isActive);
  });
  window.scrollTo({top:0, behavior:'instant'});
  const vid = document.querySelector('.hero video');
  if(vid){ vid.play().catch(()=>{}); }

  if(route === 'contacts'){
    const form = document.getElementById('lead-form');
    if(form){
      form.addEventListener('submit', handleFormSubmit);
    }
  }

  if(route === 'home'){
    // Ждём кадр отрисовки, затем считаем размеры и инициализируем ScrollTrigger
    requestAnimationFrame(() => requestAnimationFrame(initHeroAnimation));
  }
}

async function handleFormSubmit(e){
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('submit-btn');
  const name = form.name.value.trim();
  const phone = form.phone.value.trim();
  const msg = form.msg.value.trim() || '—';

  if(!name || !phone){
    showToast('Пожалуйста, заполните имя и телефон', false);
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Отправка...';

  const text = `🔔 Новая заявка с сайта ЛАД!\n\n👤 Имя: ${name}\n📞 Телефон: ${phone}\n🎸 Что с гитарой: ${msg}`;

  try{
    const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text: text
      })
    });

    const data = await res.json();
    if(data.ok){
      form.reset();
      showToast('Спасибо! Заявка успешно отправлена, мы скоро свяжемся с вами в Telegram или по телефону');
    } else {
      throw new Error(data.description || 'Ошибка отправки');
    }
  } catch(err){
    console.error(err);
    showToast('Не удалось отправить. Попробуйте ещё раз или позвоните нам.', false);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Отправить заявку';
  }
}

document.getElementById('nav').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-route]');
  if(btn) location.hash = btn.dataset.route;
});

document.getElementById('app').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-goto]');
  if(btn) location.hash = btn.dataset.goto;
});

window.addEventListener('hashchange', navigate);
navigate();
</script>
